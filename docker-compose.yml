version: '3.8'

services:
  backend:
    build:
      context: ./backend-novedades
      dockerfile: Dockerfile
    container_name: trapiche-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "${APP_NAME:-Trapiche Novedades}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:PlzChangeThisKeyGeneratedWithArtisanKeyGenerate=}"
      APP_URL: "${APP_URL:-https://api-novedades.manevoapp.com}"
      FRONTEND_URL: "${FRONTEND_URL:-https://trapiche.manevoapp.com}"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/storage/database.sqlite}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://trapiche.manevoapp.com,http://localhost:5173,http://localhost}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-trapiche.manevoapp.com,api-novedades.manevoapp.com,localhost,localhost:5173,localhost:8000}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-.manevoapp.com}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEED: "${RUN_SEED:-true}"
    volumes:
      - backend-storage:/var/www/html/storage

  frontend:
    build:
      context: ./frontend-novedades
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://api-novedades.manevoapp.com}"
    container_name: trapiche-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-storage:
