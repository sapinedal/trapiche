version: '3.8'

services:
  backend:
    build:
      context: ./backend-novedades
      dockerfile: Dockerfile
    container_name: trapiche-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Trapiche Novedades"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:PlzChangeThisKeyGeneratedWithArtisanKeyGenerate="
      APP_URL: "http://localhost:8000"
      FRONTEND_URL: "http://localhost:5173"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/database.sqlite
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost"
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:5173,localhost:8000"
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    volumes:
      - backend-storage:/var/www/html/storage

  frontend:
    build:
      context: ./frontend-novedades
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000"
    container_name: trapiche-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-storage:
